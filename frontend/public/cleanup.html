<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>清理 5173 缓存</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center;
             background: #0d0f13; color: #e7eaf0;
             font-family: system-ui, 'Segoe UI', 'PingFang SC', sans-serif; }
      .box { max-width: 480px; padding: 28px; text-align: center;
             border: 1px solid #252b36; border-radius: 12px; background: #161a21; }
      code { color: #6b8fff; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>正在清理旧项目残留…</h2>
      <p id="msg">注销 Service Worker、清空缓存与本地存储…</p>
    </div>
    <script>
      (async () => {
        const msg = document.getElementById('msg')
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations()
            await Promise.all(regs.map((r) => r.unregister()))
          }
          if (window.caches) {
            const keys = await caches.keys()
            await Promise.all(keys.map((k) => caches.delete(k)))
          }
          try { localStorage.clear(); sessionStorage.clear() } catch {}
          msg.textContent = '清理完成，跳转回首页…'
          setTimeout(() => location.replace('/'), 800)
        } catch (e) {
          msg.textContent = '自动清理失败：' + (e && e.message ? e.message : e)
          msg.innerHTML += '<br>请手动：F12 → Application → Service Workers → Unregister'
        }
      })()
    </script>
  </body>
</html>
