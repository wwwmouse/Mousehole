# Development mode: Vite dev server + FastAPI --reload + PostgreSQL.
# Do not run together with docker-compose.yml (they share the same project name
# and data volumes).
name: mousehole

services:
  postgres:
    image: postgres:16-alpine
    container_name: mousehole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mousehole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mousehole}
      POSTGRES_DB: ${POSTGRES_DB:-mousehole}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mousehole} -d ${POSTGRES_DB:-mousehole}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mousehole-backend-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-mousehole}:${POSTGRES_PASSWORD:-mousehole}@postgres:5432/${POSTGRES_DB:-mousehole}
      STORAGE_DIR: /data/storage
      DATA_DIR: /data/data
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-80}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-120}
      DEFAULT_CONTEXT_BUDGET_TOKENS: ${DEFAULT_CONTEXT_BUDGET_TOKENS:-32768}
    volumes:
      - ./backend:/app
      - ./storage:/data/storage
      - ./data:/data/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: mousehole-frontend-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
