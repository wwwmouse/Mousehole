name: mousehole

services:
  postgres:
    image: postgres:16-alpine
    container_name: mousehole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mousehole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mousehole}
      POSTGRES_DB: ${POSTGRES_DB:-mousehole}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mousehole} -d ${POSTGRES_DB:-mousehole}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mousehole-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-mousehole}:${POSTGRES_PASSWORD:-mousehole}@postgres:5432/${POSTGRES_DB:-mousehole}
      STORAGE_DIR: /data/storage
      DATA_DIR: /data/data
      CORS_ORIGINS: '["http://localhost:8090","http://127.0.0.1:8090"]'
    volumes:
      - ./storage:/data/storage
      - ./data:/data/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mousehole-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOUSEHOLE_HTTP_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  pgdata:
